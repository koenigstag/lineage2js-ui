name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lineage2js/ui build:pages
        env:
          VITE_SKILL_ICON_BASE_URL: ${{ vars.VITE_SKILL_ICON_BASE_URL }}
          VITE_ITEM_ICON_BASE_URL: ${{ vars.VITE_ITEM_ICON_BASE_URL }}
          VITE_ACTION_ICON_BASE_URL: ${{ vars.VITE_ACTION_ICON_BASE_URL }}
          VITE_CLASS_ICON_BASE_URL: ${{ vars.VITE_CLASS_ICON_BASE_URL }}
          VITE_LOGIN_SERVER_IP: ${{ vars.VITE_LOGIN_SERVER_IP }}
          VITE_LOGIN_SERVER_PORT: ${{ vars.VITE_LOGIN_SERVER_PORT }}
          VITE_LOGIN_SERVER_SECURE: ${{ vars.VITE_LOGIN_SERVER_SECURE }}
          # Unused by main's code yet -- this repo still decodes raw .l2j
          # regions client-side (VITE_GEODATA_REGION_BASE_URL) here; the
          # pre-baked tile pipeline this var feeds is only on the
          # claude/l2j-geodata-wireframe branch/PR. Passed through already so
          # nothing else needs to change here once that merges.
          VITE_GEODATA_TILE_BASE_URL: ${{ vars.VITE_GEODATA_TILE_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
