name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every VITE_* the client reads (see packages/ui/src/vite-env.d.ts) is
      # passed through, so a repository variable is all it takes to point a
      # deploy at an assets server. An unset one is not an error: each
      # consumer falls back on its own (placeholder icon, procedural body,
      # hidden link, r3f backdrop instead of a login video).
      #
      # Deliberately NOT here, and not to be added: VITE_DEV_LOGIN_USERNAME/
      # VITE_DEV_LOGIN_PASSWORD (dev-only, and a VITE_* var is baked into the
      # public bundle) and VITE_IS_DEMO_MODE (a public deploy running on fake
      # data is not what this builds).
      - run: pnpm --filter @lineage2js/ui build:pages
        env:
          # Icon folders on the assets server -- see config/icon-urls.ts.
          VITE_SKILL_ICON_BASE_URL: ${{ vars.VITE_SKILL_ICON_BASE_URL }}
          VITE_ITEM_ICON_BASE_URL: ${{ vars.VITE_ITEM_ICON_BASE_URL }}
          VITE_SLOT_ICON_BASE_URL: ${{ vars.VITE_SLOT_ICON_BASE_URL }}
          VITE_ACTION_ICON_BASE_URL: ${{ vars.VITE_ACTION_ICON_BASE_URL }}
          VITE_CLASS_ICON_BASE_URL: ${{ vars.VITE_CLASS_ICON_BASE_URL }}
          VITE_RACE_ICON_BASE_URL: ${{ vars.VITE_RACE_ICON_BASE_URL }}
          VITE_GAME_MENU_ICON_BASE_URL: ${{ vars.VITE_GAME_MENU_ICON_BASE_URL }}

          # Login screen: backdrop art and the three external links.
          VITE_REGISTER_URL: ${{ vars.VITE_REGISTER_URL }}
          VITE_RESTORE_PASSWORD_URL: ${{ vars.VITE_RESTORE_PASSWORD_URL }}
          VITE_WIKI_URL: ${{ vars.VITE_WIKI_URL }}

          # Converted character bodies, one <rig>.glb per race/sex -- see
          # assets-server/scripts/convert-client-rigs.ts. Unset leaves every
          # character on the procedural placeholder.
          VITE_CHARACTER_MODEL_BASE_URL: ${{ vars.VITE_CHARACTER_MODEL_BASE_URL }}

          # Character textures, from the same converter as the bodies. Unset
          # leaves every body on its flat per-part tints -- and the face and
          # hair-colour choices with nothing to show, since both are texture
          # swaps rather than different meshes.
          VITE_CHARACTER_TEXTURE_BASE_URL: ${{ vars.VITE_CHARACTER_TEXTURE_BASE_URL }}

          # Real cursor art (.cur files) -- see config/cursor-urls.ts. Unset
          # leaves the browser's native cursor in place everywhere.
          VITE_CURSOR_BASE_URL: ${{ vars.VITE_CURSOR_BASE_URL }}

          # Pre-baked geodata tiles, plus the opt-in stitching mode (unset is
          # the default, which matches the real G3D editor -- see
          # config/env.ts's IS_GEODATA_TERRAIN_SMOOTH).
          VITE_GEODATA_TILE_BASE_URL: ${{ vars.VITE_GEODATA_TILE_BASE_URL }}
          VITE_GEODATA_TERRAIN_SMOOTH: ${{ vars.VITE_GEODATA_TERRAIN_SMOOTH }}

          # Login server the deployed client connects to. Pages is https, so
          # VITE_LOGIN_SERVER_SECURE has to be "true" there -- a browser
          # blocks a plain ws:// connection from an https page.
          VITE_LOGIN_SERVER_IP: ${{ vars.VITE_LOGIN_SERVER_IP }}
          VITE_LOGIN_SERVER_PORT: ${{ vars.VITE_LOGIN_SERVER_PORT }}
          VITE_LOGIN_SERVER_SECURE: ${{ vars.VITE_LOGIN_SERVER_SECURE }}

          # Protocol-layer log verbosity bitmask, read by the network
          # package's Logger (NONE=0, INFO=1, WARNING=2, ERROR=4, DEBUG=8).
          # Unset defaults to INFO; here so a live deploy can be turned up to
          # DEBUG without editing this file.
          VITE_L2JSC_LOG_LEVEL: ${{ vars.VITE_L2JSC_LOG_LEVEL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
