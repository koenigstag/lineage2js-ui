# The web client itself: a static bundle served from your own host.
#
# A TEMPLATE: `example.com` below stands for the domain you actually serve
# from, and has to be replaced in all three places before this is installed.
# The real domain deliberately appears nowhere in this repository.
#
# Port 4443 rather than 443 is one way to do this, and the one this was
# written for: it lets the client sit on a host whose 443 already belongs to
# something else, without needing a new subdomain, a DNS record or a second
# certificate. If 443 is free, use it and drop the port from the URLs.
#
# Nothing in the bundle knows its own port or host. The app is served at the
# root of whatever host reaches it (base "/", see packages/ui/package.json's
# `build`), and every asset URL it fetches is absolute and configured through
# VITE_* at build time. So moving this to another port, host or subdomain is a
# change to this file plus DNS, with no rebuild.
server {
    listen 4443 ssl;
    listen [::]:4443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/l2client/dist;
    index index.html;

    # The main bundle is 1.6MB of JS that gzips to 464kB, which is essentially
    # everything this vhost serves -- the reference tables, icons and meshes
    # all come from the assets server, which compresses its own.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Revalidate by default: index.html keeps its name across deploys while
    # its contents change on every one of them, so it must never be trusted
    # blind. /assets/ is the exception, overridden below. nginx sends an ETag
    # for static files, so revalidation costs a 304.
    add_header Cache-Control "no-cache";

    # Screens live in the URL hash (see src/App.tsx), so a deep link is always
    # a request for "/". This fallback is only there to catch a stray path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes these filenames, so changed content is a changed URL and the
    # browser never needs to ask about them again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
